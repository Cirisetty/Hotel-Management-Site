<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <style>
        *{
            margin: 0px;
        }
        body{
            background-image: url("signupback.jpg");
            background-size: cover;
            background-position: fixed;

        }
      
        .form-control{background-image:linear-gradient(90deg,skyblue,pink);width:500px;height:650px;margin-top: 30px;opacity: 0.9;box-shadow: 0 5px 10px wheat;border-top-right-radius: 50px;border-top-left-radius: 50px;border-bottom-left-radius: 50px;border-bottom-right-radius: 50px;}
        .fname label{display:block;font-size:25px;margin-left:-200px;opacity:0.8;}
         .lname label{display:block;font-size:25px;margin-left:-210px;opacity:0.8;margin-top:10px}
         .cpass label{display:block;font-size:25px;margin-left:-140px;opacity:0.8;margin-top:10px}
          .conpass label{display:block;font-size:25px;margin-left:-130px;opacity:0.8;margin-top:10px}
          .Email label{display:block;font-size:25px;margin-left:-150px;opacity:0.8;margin-top:10px}
          .fname input:hover{background-image:linear-gradient(90deg,white ,skyblue);}
           .lname input:hover{background-image:linear-gradient(90deg,white ,skyblue);}
            .Email input:hover{background-image:linear-gradient(90deg,white ,skyblue);}
             .cpass input:hover{background-image:linear-gradient(90deg,white ,skyblue);}
              .conpass input:hover{background-image:linear-gradient(90deg,white ,skyblue);}
              .signup button{background-image:linear-gradient(to bottom right,white,blue);box-shadow:0 5px 10px black;width:130px;height:40px;margin-top:20px;font-size:18px;margin-left:-20px}
              .fname input{box-shadow:0 5px 10px black;width:300px;height:35px;margin-left:-25px}
              .lname input{box-shadow:0 5px 10px black;width:300px;height:35px;margin-left:-25px}
              .Email input{box-shadow:0 5px 10px black;width:300px;height:35px;margin-left:-25px}
              .cpass input{box-shadow:0 5px 10px black;width:300px;height:35px;margin-left:-25px}
              .conpass input{box-shadow:0 5px 10px black;width:300px;height:35px;margin-left:-25px}
              nav a{text-decoration: none;margin:35px;display:inline;font-family:Arial, Helvetica, sans-serif;font-size:25px;color:wheat;padding-left: 5px;opacity: 0.6;}
              nav{padding-top:5px;padding-bottom:5px;margin-left:0px;margin-left:-9px;background-image: linear-gradient(45deg,#071C6D,#7BC0F7);width:inherit;margin-right:-10px;}
              header{font-family:'Times New Roman';font-size:60px;letter-spacing: 18px;color:black;background-image: linear-gradient(45deg,#071C6D,#7BC0F7);padding-top:15px;margin-left:-10px;margin-right:-10px;padding-bottom: 10px;text-align:center}
         
    </style>
    
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous">
    </script>
    <script>
        
            function addData()
            {
             var addEmail=document.getElementById("email").value;
             var addPassword=document.getElementById("pass").value;
     
             //store data 
                localStorage.setItem("UserEmail",addEmail);
                localStorage.setItem("UserPassword", addPassword);
            }
            
    </script>
    <div class="hcon">
        <header>MINE  <span style="color:cyan">BEACH</span>  RESORT</header>
        <nav>
            <a href="home.html"  target="_self">HOME</a>
            <a href="about.html" target="_self">ABOUT</a>
            <a href="accomodation.html" target="_self" >ACCOMODATION</a>
            
            <a href="" >RESERVATIONS</a>
            <a href="contact.html"  target="_self">CONTACT</a>
            </nav> 
            </div>
 <center>
        <form class="form-control" action="sign.html">
        <div class="logo">
             <svg xmlns="http://www.w3.org/2000/svg" width="10vh"  fill="currentColor" class="bi bi-person-plus" viewBox="0 0 16 16">
              <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H1s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C9.516 10.68 8.289 10 6 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
              <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z"/>
             </svg>
             <i class="bi bi-person-plus"></i>
        </div>
        <div>
              <h1>Create Your Account </h1>
        </div>
         
        <div class="fname">
            <label>First Name</label>
            <input type="text" class="First-Name">
        </div>
         <div class="lname">
            <label>Last Name</label>
            <input type="text" class="Last-Name">
        </div>
        <div class="Email">
            <label>Enter Your Email</label>
            <input type="text" class="Maild" id="email">
        </div>
        <div class="cpass">
            <label>Create Password</label>
            <input type="password" class="Create-Password" maxlength="12">
        </div>
        <div class="conpass">
            <label>Confirm Password</label>
            <input type="password" class="Confirm-Password" id="pass" name=maxlength="12">
        </div>
        <div class="signup">
            <button onclick="addData()">Signup</button>
        </div>
        </form>
        </center> 
        </body>
</html>
