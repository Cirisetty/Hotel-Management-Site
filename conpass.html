<!DOCTYPE html>
<html>
<title>Online HTML Editor</title>
<head>
    <style>
       .header p{font-family:Arial, Helvetica, sans-serif;font-size:40px;opacity: 0.5;} 
       .cpass label{display:block;font-size:28px;font-family:Arial, Helvetica, sans-serif;margin-bottom:1px;opacity: 0.5;}
       .conpass label{margin-bottom:10px;display:block;font-size:28px;font-family:Arial, Helvetica, sans-serif;opacity: 0.5;}
       .cpass input{width:200px;height:20px;width:250px;height:30px;box-shadow:0 5px 10px black}
       .conpass input{width:200px;height:20px;width:250px;height:30px;box-shadow:0 5px 10px black}
        .toogle input{width:50px;height:20px;margin-left:-50px;margin-top:10px}
        .toogle p{margin-left:90px;margin-top:-22px;font-family:Arial, Helvetica, sans-serif;}
        .reset button{width:120px;height:35px;margin-left:-20px;font-family:Arial, Helvetica, sans-serif;background-image:linear-gradient(to bottom right,deeppink,violet);box-shadow:0 5px 10px black}
        .form-control {margin-top:150px;background-image:linear-gradient(to right,red,white,deeppink);width:500px;height:500px;padding-top:40px}
        body{background-image:linear-gradient(to right,deeppink,white,red)}
    </style>
</head>
<body>
<center>
<div class="form-control">
    <form>
        <div class="header">
        <p  >MINE BEACH RESORT</p>
        </div>
        <div class="cpass">
            <p>
                <label>New Password</label><br>
                <input type="password" maxlength="12">
            </p>
        </div>
        <div class="conpass">
                   <label>Confirm Password</label>
                   <input type="password"  id="myInput" maxlength="12">
     </div>
     <div class="toogle">
                          <input type="checkbox" onclick="myFunction()" ><p>Show Password</p>
    </div>
    <div class="reset">
        <button type="button"  onclick="msg()">Reset</button>
         <p id="message" style="display: none;color:darkgreen;font-size:20px">
            You password reseted succesfully
         </p>
        
    </div>
    <script>
        function myFunction() {
        var x = document.getElementById("myInput");
        if (x.type === "password") {
            x.type = "text";
        } else {
            x.type = "password";
        }
    }
    function msg()
    {
        document.getElementById("message").style.display="block"; 
    }
    

    </script>
    </form>
</div>
</center>
</body>
</html>
